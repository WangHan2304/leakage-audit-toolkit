[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audit_toolkit"
version = "0.1.0"
description = "Material-agnostic leakage-audit checks (A1--A5) and pre-modeling screens for small-sample materials-ML regression corpora."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Ti6Al4V LPBF Project authors" },
]
keywords = [
  "leakage audit",
  "cross-validation",
  "materials informatics",
  "laser powder bed fusion",
  "data provenance",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
audit-toolkit = "audit_toolkit.cli:main"

[tool.setuptools]
packages = ["audit_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
